apiVersion: apps/v1
kind: Deployment
metadata:
  name: fileapi
spec:
  replicas: 2
  selector:
    matchLabels:
      app: fileapi
  template:
    metadata:
      labels:
        app: fileapi
    spec:
      containers:
        - name: fileapi
          image: fileapi:1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: fileapi-env
---
apiVersion: v1
kind: Service
metadata:
  name: fileapi
spec:
  type: NodePort
  selector:
    app: fileapi
  ports:
    - port: 80
      targetPort: 8080
      nodePort: 30080

